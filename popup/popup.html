<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      background: #09090b;
      color: #d4d4d8;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #ef4444;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .title {
      font-size: 15px;
      font-weight: 650;
      color: #fafafa;
      letter-spacing: -0.3px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: #1c1c21;
      color: #71717a;
      margin-bottom: 12px;
    }
    .status.picking {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
    }
    .count-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 16px;
      padding: 10px 12px;
      background: #131316;
      border: 1px solid #27272a;
      border-radius: 10px;
    }
    .count-box svg { color: #52525b; flex-shrink: 0; }
    .count-num { color: #ef4444; font-weight: 700; }
    button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: #ef4444;
      color: white;
      margin-bottom: 8px;
    }
    .btn-primary:hover { background: #dc2626; }
    .btn-primary.picking {
      background: transparent;
      color: #ef4444;
      border-color: #ef4444;
    }
    .btn-primary.picking:hover { background: rgba(239, 68, 68, 0.1); }
    .btn-secondary {
      background: #131316;
      color: #a1a1aa;
      border-color: #27272a;
    }
    .btn-secondary:hover {
      background: #1c1c21;
      color: #fafafa;
      border-color: #3f3f46;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">S</div>
    <div class="title">Universal Scraper</div>
  </div>

  <div id="status" class="status">Ready</div>

  <div class="count-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
    <span><span id="selectedCount" class="count-num">0</span> elements selected</span>
  </div>

  <button id="pickBtn" class="btn-primary">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
    Start Picking
  </button>
  <button id="panelBtn" class="btn-secondary">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
    Open Side Panel
  </button>

  <script src="popup.js"></script>
</body>
</html>
