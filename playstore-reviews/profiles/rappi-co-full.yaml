# Misma ficha que rappi-co, con el tope y el ritmo listos para una corrida larga.
# No es el default. Lánzalo cuando quieras el histórico:
#   python -m playstore_reviews --config profiles/rappi-co-full.yaml

extends: rappi-co.yaml
name: rappi-co-full

transport:
  strategy: auto
  strategy_order:
    - library
    - batchexecute
  per_query_limit: 2000
  page_size: 150
  delay_seconds: 2
  jitter_seconds: 1
  max_retries: 5
  retry_backoff_seconds: 2
  request_timeout_seconds: 45
  proxies: []

output:
  dir: output
  manifest: true
  log_level: info
