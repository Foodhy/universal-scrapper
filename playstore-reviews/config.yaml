# Prueba de concepto: reseñas públicas de SoyRappi en Colombia.
# Cambia estos valores en otra sesión; no hace falta tocar el código.

app_id: com.rappi.storekeeper
# También puedes pegar el enlace completo en lugar del id:
# app_url: https://play.google.com/store/apps/details?id=com.rappi.storekeeper&hl=es_CO

lang: es
country: co

# phone = Teléfono, tablet = Tablet. También: chromebook, tv.
devices:
  - phone
  - tablet

# Solo 1 y 2 estrellas en esta prueba.
scores:
  - 1
  - 2

# newest | relevant | rating
sort: newest

# Tope por combinación dispositivo + estrellas. Sube este número cuando quieras la corrida completa.
per_query_limit: 20
page_size: 20

# library | batchexecute | auto
# auto prueba la librería y, si falla, usa el POST público directo.
strategy: auto

# Pausa entre páginas y entre consultas, para no martillar el endpoint.
delay_seconds: 1.5
jitter_seconds: 0.8
max_retries: 3

# Lista vacía = sin proxy. También se lee PLAYSTORE_PROXIES del entorno.
proxies: []

output_dir: output
