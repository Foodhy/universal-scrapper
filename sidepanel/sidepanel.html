<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: '#0f0f0f', 1: '#1a1a1a', 2: '#262626' },
            accent: { DEFAULT: '#ef4444', hover: '#dc2626' },
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0f0f0f; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #404040; border-radius: 3px; }
    .tab-btn.active { border-color: #ef4444; color: #ef4444; }
  </style>
</head>
<body class="text-neutral-300 text-sm font-sans min-h-screen">
  <!-- Header -->
  <div class="sticky top-0 bg-surface z-10 border-b border-neutral-800 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 bg-accent rounded flex items-center justify-center text-white text-xs font-bold">S</div>
        <h1 class="text-base font-semibold text-white">Universal Scraper</h1>
      </div>
      <div id="statusBadge" class="px-2 py-0.5 rounded text-xs bg-surface-2 text-neutral-500">Idle</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex border-b border-neutral-800">
    <button class="tab-btn active flex-1 py-2 text-center text-xs border-b-2 border-transparent text-neutral-500 hover:text-neutral-300 transition" data-tab="picker">Picker</button>
    <button class="tab-btn flex-1 py-2 text-center text-xs border-b-2 border-transparent text-neutral-500 hover:text-neutral-300 transition" data-tab="results">Results</button>
    <button class="tab-btn flex-1 py-2 text-center text-xs border-b-2 border-transparent text-neutral-500 hover:text-neutral-300 transition" data-tab="library">Library</button>
  </div>

  <!-- Picker Tab -->
  <div id="tab-picker" class="tab-content p-4 space-y-4">
    <!-- Pick mode toggle -->
    <button id="pickToggle" class="w-full py-2.5 rounded-lg bg-accent text-white font-medium hover:bg-accent-hover transition">
      Start Picking
    </button>

    <!-- Selected elements -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-semibold text-neutral-400 uppercase tracking-wide">Selected Elements</h2>
        <button id="clearAll" class="text-xs text-neutral-500 hover:text-accent transition">Clear all</button>
      </div>
      <div id="elementList" class="space-y-2">
        <div class="text-neutral-600 text-xs py-6 text-center">No elements selected yet</div>
      </div>
    </div>

    <!-- Extraction Mode -->
    <div>
      <h2 class="text-xs font-semibold text-neutral-400 uppercase tracking-wide mb-2">Extraction Mode</h2>
      <div class="grid grid-cols-2 gap-2">
        <label class="mode-option flex items-center gap-2 p-2.5 rounded-lg bg-surface-1 border border-neutral-800 cursor-pointer hover:border-neutral-600 transition has-[:checked]:border-accent">
          <input type="radio" name="mode" value="single" checked class="accent-accent">
          <div>
            <div class="text-xs font-medium text-neutral-200">Single</div>
            <div class="text-[10px] text-neutral-500">Current page</div>
          </div>
        </label>
        <label class="mode-option flex items-center gap-2 p-2.5 rounded-lg bg-surface-1 border border-neutral-800 cursor-pointer hover:border-neutral-600 transition has-[:checked]:border-accent">
          <input type="radio" name="mode" value="pagination" class="accent-accent">
          <div>
            <div class="text-xs font-medium text-neutral-200">Pagination</div>
            <div class="text-[10px] text-neutral-500">Click next</div>
          </div>
        </label>
        <label class="mode-option flex items-center gap-2 p-2.5 rounded-lg bg-surface-1 border border-neutral-800 cursor-pointer hover:border-neutral-600 transition has-[:checked]:border-accent">
          <input type="radio" name="mode" value="list" class="accent-accent">
          <div>
            <div class="text-xs font-medium text-neutral-200">List</div>
            <div class="text-[10px] text-neutral-500">Click each item</div>
          </div>
        </label>
        <label class="mode-option flex items-center gap-2 p-2.5 rounded-lg bg-surface-1 border border-neutral-800 cursor-pointer hover:border-neutral-600 transition has-[:checked]:border-accent">
          <input type="radio" name="mode" value="scroll" class="accent-accent">
          <div>
            <div class="text-xs font-medium text-neutral-200">Scroll</div>
            <div class="text-[10px] text-neutral-500">Infinite scroll</div>
          </div>
        </label>
      </div>
    </div>

    <!-- Pagination config (hidden by default) -->
    <div id="paginationConfig" class="hidden space-y-2">
      <button id="markNextBtn" class="w-full py-2 rounded-lg bg-amber-500/10 text-amber-500 border border-amber-500/30 text-xs font-medium hover:bg-amber-500/20 transition">
        Mark "Next" Button
      </button>
      <div id="nextBtnStatus" class="text-xs text-neutral-500"></div>
      <label class="flex items-center justify-between text-xs">
        <span class="text-neutral-400">Max pages</span>
        <input id="maxPages" type="number" value="10" min="1" max="100" class="w-16 px-2 py-1 rounded bg-surface-1 border border-neutral-700 text-neutral-200 text-right">
      </label>
    </div>

    <!-- List config (hidden by default) -->
    <div id="listConfig" class="hidden space-y-2">
      <button id="markListBtn" class="w-full py-2 rounded-lg bg-blue-500/10 text-blue-500 border border-blue-500/30 text-xs font-medium hover:bg-blue-500/20 transition">
        Mark List Items
      </button>
      <div id="listItemStatus" class="text-xs text-neutral-500"></div>
    </div>

    <!-- Scroll config (hidden by default) -->
    <div id="scrollConfig" class="hidden space-y-2">
      <label class="flex items-center justify-between text-xs">
        <span class="text-neutral-400">Max scrolls</span>
        <input id="maxScrolls" type="number" value="20" min="1" max="200" class="w-16 px-2 py-1 rounded bg-surface-1 border border-neutral-700 text-neutral-200 text-right">
      </label>
      <label class="flex items-center justify-between text-xs">
        <span class="text-neutral-400">Scroll delay (ms)</span>
        <input id="scrollDelay" type="number" value="1500" min="500" max="5000" step="100" class="w-20 px-2 py-1 rounded bg-surface-1 border border-neutral-700 text-neutral-200 text-right">
      </label>
    </div>

    <!-- Extract button -->
    <button id="extractBtn" class="w-full py-2.5 rounded-lg bg-emerald-600 text-white font-medium hover:bg-emerald-700 transition disabled:opacity-40 disabled:cursor-not-allowed" disabled>
      Start Extraction
    </button>

    <!-- Progress (hidden by default) -->
    <div id="progressSection" class="hidden">
      <div class="flex items-center justify-between text-xs mb-1">
        <span id="progressText" class="text-neutral-400">Extracting...</span>
        <button id="stopBtn" class="text-accent hover:text-accent-hover text-xs">Stop</button>
      </div>
      <div class="w-full bg-surface-2 rounded-full h-1.5">
        <div id="progressBar" class="bg-accent h-1.5 rounded-full transition-all" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- Results Tab -->
  <div id="tab-results" class="tab-content hidden p-4 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-semibold text-neutral-400 uppercase tracking-wide">
        Results <span id="resultCount" class="text-accent">(0)</span>
      </h2>
      <div class="flex gap-2">
        <button class="export-btn text-xs px-2 py-1 rounded bg-surface-1 border border-neutral-700 hover:border-neutral-500 transition" data-format="json">JSON</button>
        <button class="export-btn text-xs px-2 py-1 rounded bg-surface-1 border border-neutral-700 hover:border-neutral-500 transition" data-format="csv">CSV</button>
        <button class="export-btn text-xs px-2 py-1 rounded bg-surface-1 border border-neutral-700 hover:border-neutral-500 transition" data-format="markdown">MD</button>
        <button class="export-btn text-xs px-2 py-1 rounded bg-surface-1 border border-neutral-700 hover:border-neutral-500 transition" data-format="html">HTML</button>
      </div>
    </div>
    <div id="resultsTable" class="overflow-x-auto">
      <div class="text-neutral-600 text-xs py-6 text-center">No results yet. Select elements and run extraction.</div>
    </div>
    <button id="saveToLibrary" class="w-full py-2 rounded-lg bg-surface-1 text-neutral-400 border border-neutral-700 text-xs font-medium hover:border-neutral-500 hover:text-neutral-200 transition hidden">
      Save to Library
    </button>
  </div>

  <!-- Library Tab -->
  <div id="tab-library" class="tab-content hidden p-4 space-y-4">
    <h2 class="text-xs font-semibold text-neutral-400 uppercase tracking-wide">Saved Scrapes</h2>
    <div id="libraryList" class="space-y-2">
      <div class="text-neutral-600 text-xs py-6 text-center">No saved scrapes yet.</div>
    </div>
  </div>

  <script src="../storage/db.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
